name: Auto Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - plugin.json

permissions:
  contents: write

# Serialize every release and its stable update.json commit.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version | select(type == "string" and length > 0)' plugin.json)"
          # Explicitly reject build metadata: different manifests must not
          # share a precedence-equivalent release or a metadata-only tag.
          SEMVER='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $SEMVER ]]; then
            echo "Invalid release version in plugin.json: $VERSION"
            exit 1
          fi

          # Numeric prerelease identifiers cannot have leading zeroes.
          RELEASE_VERSION="${VERSION#v}"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${RELEASE_VERSION#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Invalid numeric prerelease identifier: $identifier"
                exit 1
              fi
            done
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          TAG="v${RELEASE_VERSION}"
          printf 'version=%s\ntag=%s\nprerelease=%s\n' \
            "$VERSION" "$TAG" "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Confirm that the version changed
        id: version_change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Cannot establish the prior main commit; refusing to infer a version bump.'
            exit 1
          fi
          if ! git cat-file -e "${BEFORE_SHA}:plugin.json"; then
            echo "Cannot read plugin.json at previous commit $BEFORE_SHA."
            exit 1
          fi
          PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:plugin.json" | jq -er '.version | select(type == "string" and length > 0)')"
          if [[ "$PREVIOUS_VERSION" == "$CURRENT_VERSION" ]]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            echo 'plugin.json version is unchanged; no release required.'
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse superseded version bumps
        id: current
        if: steps.version_change.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          MAIN_VERSION="$(git show origin/main:plugin.json | jq -er '.version | select(type == "string" and length > 0)')"
          if [[ "v${MAIN_VERSION#v}" != "v${VERSION#v}" ]]; then
            printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded version $VERSION; main is already $MAIN_VERSION."
          else
            printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing tag and release
        id: existing
        if: steps.current.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TARGET="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [[ "$TARGET" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to $TARGET, not the release commit $GITHUB_SHA."
              exit 1
            fi
            printf 'tag_exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'tag_exists=false\n' >> "$GITHUB_OUTPUT"
          fi

          # A tag from an interrupted run is allowed, but an unrelated release
          # or an incompatible prerelease flag is not.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease >/dev/null 2>&1; then
            if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "Release $TAG exists without a fetched tag."
              exit 1
            fi
            ACTUAL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [[ "$ACTUAL" != "$PRERELEASE" ]]; then
              echo "Release $TAG has isPrerelease=$ACTUAL, expected $PRERELEASE."
              exit 1
            fi
            printf 'release_exists=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'release_exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes section from CHANGELOG.md
        if: steps.current.outputs.eligible == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f CHANGELOG.md || { echo 'CHANGELOG.md is required.'; exit 1; }
          CHANGELOG_VERSION="${VERSION#v}"
          awk -v version="$CHANGELOG_VERSION" -v prefixed_version="$VERSION" '
            function matches_heading(line, candidate, heading, suffix) {
              heading = "## [" candidate "]"
              if (index(line, heading) != 1) return 0
              suffix = substr(line, length(heading) + 1)
              return suffix ~ /^[[:space:]]/
            }
            {
              if (!found && (matches_heading($0, version) ||
                  (prefixed_version != version && matches_heading($0, prefixed_version)))) {
                found = 1
                lines[++count] = $0
                next
              }
              if (found && $0 ~ /^## \[/) found = 0
              if (found) lines[++count] = $0
            }
            END {
              start = 1; end = count
              while (start <= end && lines[start] ~ /^[[:space:]]*$/) start++
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]] || ! tail -n +2 release_notes.md | grep -q '[^[:space:]]'; then
            echo "No non-empty CHANGELOG section for $VERSION."
            exit 1
          fi
          grep -Fxq '### 日本語' release_notes.md || { echo 'Missing Japanese notes.'; exit 1; }
          grep -Fxq '### English' release_notes.md || { echo 'Missing English notes.'; exit 1; }
          if grep -Fq '**Full Changelog**:' release_notes.md; then
            echo 'Do not duplicate Full Changelog links in CHANGELOG.md.'
            exit 1
          fi

          # Exclude tags already attached to this exact commit (e.g. a retry).
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$PREV_TAG" && "$PREV_TAG" != "$TAG" ]]; then
            FULL_CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            FULL_CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
          fi
          printf '\n\n**Full Changelog**: %s\n' "$FULL_CHANGELOG_URL" >> release_notes.md

      - name: Build and verify plugin artifact
        if: steps.current.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=pelican-mod-manager.zip "$GITHUB_SHA" \
            plugin.json LICENSE config database lang resources src
          unzip -tq pelican-mod-manager.zip
          unzip -Z1 pelican-mod-manager.zip > archive-files.txt
          grep -Fxq 'plugin.json' archive-files.txt
          grep -Fxq 'LICENSE' archive-files.txt

          while IFS= read -r path; do
            case "$path" in
              plugin.json|LICENSE|config|config/*|database|database/*|lang|lang/*|resources|resources/*|src|src/*) ;;
              *) echo "Unexpected file in plugin ZIP: $path"; exit 1 ;;
            esac
            case "$path" in
              .env|.env.*|*/.env|*/.env.*)
                echo "Refusing to package a private environment file: $path"
                exit 1 ;;
            esac
          done < archive-files.txt
          if sort archive-files.txt | uniq -d | grep -q .; then
            echo 'Duplicate archive entries found.'
            exit 1
          fi
          ZIP_VERSION="$(unzip -p pelican-mod-manager.zip plugin.json | jq -er '.version | select(type == "string" and length > 0)')"
          if [[ "v${ZIP_VERSION#v}" != "$TAG" ]]; then
            echo "ZIP plugin.json version $ZIP_VERSION does not match $TAG."
            exit 1
          fi

      - name: Create or verify release tag
        if: steps.current.outputs.eligible == 'true' && steps.existing.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if main advanced to another version while packaging.
          git fetch --quiet origin main
          MAIN_VERSION="$(git show origin/main:plugin.json | jq -er '.version')"
          if [[ "v${MAIN_VERSION#v}" != "$TAG" ]]; then
            echo "main now has $MAIN_VERSION; refusing to publish superseded $TAG."
            exit 1
          fi
          git fetch --quiet --tags origin
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          git fetch --quiet --tags origin
          TARGET="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$TARGET" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: tag $TAG points to $TARGET."
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.current.outputs.eligible == 'true' && steps.existing.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG"
                --notes-file release_notes.md --verify-tag)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest=true)
          fi
          gh release create "$TAG" pelican-mod-manager.zip "${args[@]}"

      - name: Verify and repair release artifact
        if: steps.current.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin
          TARGET="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [[ "$TARGET" == "$GITHUB_SHA" ]] || { echo 'Release tag commit mismatch.'; exit 1; }
          ACTUAL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          [[ "$ACTUAL" == "$PRERELEASE" ]] || { echo 'Release channel mismatch.'; exit 1; }

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'pelican-mod-manager.zip'; then
            # Recover only the missing asset; never overwrite an existing one.
            gh release upload "$TAG" pelican-mod-manager.zip --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq 'pelican-mod-manager.zip'
          if [[ "$PRERELEASE" == true ]]; then
            LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            [[ "$LATEST" != "$TAG" ]] || { echo 'Prerelease unexpectedly became Latest.'; exit 1; }
          fi

      - name: Update update.json for stable release
        if: steps.current.outputs.eligible == 'true' && steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/pelican-mod-manager.zip"
          jq --indent 4 --arg version "$VERSION" --arg download_url "$DOWNLOAD_URL" \
            '.["*"].version = $version | .["*"].download_url = $download_url' \
            update.json > update.json.tmp
          mv update.json.tmp update.json

      - name: Commit updated stable release metadata
        if: steps.current.outputs.eligible == 'true' && steps.version.outputs.prerelease == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git add update.json
          if git diff --cached --quiet -- update.json; then
            echo 'update.json is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update release metadata for ${TAG} [skip ci]"
          # Non-force push: if main has advanced, fail rather than overwrite it.
          git push origin HEAD:main

      - name: Confirm prerelease metadata untouched
        if: steps.current.outputs.eligible == 'true' && steps.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- update.json
          git diff --cached --exit-code -- update.json
